<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Polyfill window.fetch with a setter to prevent Chrome extensions from throwing
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      try {
        var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function () {
            return _fetch;
          },
          set: function (fn) {
            _fetch = fn;
          },
        });
      } catch (e) {
        // Fallback: ignore if already configured
      }

      // Suppress unhandled errors originating from browser extensions
      window.addEventListener(
        'error',
        function (event) {
          if (
            event.filename &&
            (event.filename.indexOf('chrome-extension://') !== -1 ||
              event.filename.indexOf('moz-extension://') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
    </script>
